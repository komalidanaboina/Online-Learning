{% extends 'accounts/auth_base.html' %}
{% block title %}Forgot Password - LearnHub{% endblock %}
{% block auth_title %}Reset securely{% endblock %}
{% block auth_form %}
<h2>Forgot password?</h2>
<p class="muted">Enter your email and we will send a reset link.</p>
<form class="needs-validation" novalidate>
    <div class="form-floating icon-input mb-3"><input type="email" class="form-control" id="forgotEmail" placeholder="Email" required><label for="forgotEmail">Email address</label><i class="fa-solid fa-envelope"></i><div class="invalid-feedback">Enter your email.</div></div>
    <button class="btn btn-primary w-100 btn-ripple" type="submit">Send reset link</button>
</form>
<p class="auth-switch"><a href="{% url 'login' %}">Back to login</a></p>
{% endblock %}
