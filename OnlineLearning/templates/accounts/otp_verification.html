{% extends 'accounts/auth_base.html' %}
{% block title %}OTP Verification - LearnHub{% endblock %}
{% block auth_title %}Verify your email{% endblock %}
{% block auth_form %}
<h2>Enter verification code</h2>
<p class="muted">We sent a 6-digit code to your email.</p>
<form class="needs-validation" novalidate>
    <div class="otp-group" data-otp>
        <input class="form-control" maxlength="1" inputmode="numeric" required aria-label="OTP digit 1">
        <input class="form-control" maxlength="1" inputmode="numeric" required aria-label="OTP digit 2">
        <input class="form-control" maxlength="1" inputmode="numeric" required aria-label="OTP digit 3">
        <input class="form-control" maxlength="1" inputmode="numeric" required aria-label="OTP digit 4">
        <input class="form-control" maxlength="1" inputmode="numeric" required aria-label="OTP digit 5">
        <input class="form-control" maxlength="1" inputmode="numeric" required aria-label="OTP digit 6">
    </div>
    <button class="btn btn-primary w-100 mt-4 btn-ripple" type="submit">Verify account</button>
</form>
<p class="auth-switch">Did not get it? <a href="#">Resend code</a></p>
{% endblock %}
